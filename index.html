<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>proj5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 24px;
    }
    main { text-align: center; max-width: 560px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -0.03em; }
    h1 span { color: #58a6ff; }
    p { margin-top: 16px; color: #8b949e; line-height: 1.6; font-size: 1.1rem; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 24px;
      border-radius: 8px;
      background: #238636;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    a:hover { background: #2ea043; }
  </style>
</head>
<body>
  <main>
    <h1>proj<span>5</span></h1>
    <p>This site is live on GitHub Pages at 1clan.github.io/proj5.</p>
    <a href="https://github.com/1clan/proj5">View repository</a>
  </main>
</body>
</html>
