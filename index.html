<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="lifectl — a minimalist, local-first life management platform." />
  <title>lifectl — minimalist life management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c10'/%3E%3Cpath d='M8 11l5 5-5 5' stroke='%23c8ff3d' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 22h7' stroke='%2335e0ff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0c10;
      --panel: #10141b;
      --panel-2: #151a23;
      --line: #212936;
      --line-soft: #1a212c;
      --text: #e8ecf3;
      --muted: #78879c;
      --acc: #c8ff3d;
      --acc-ink: #0a0c10;
      --cyan: #35e0ff;
      --magenta: #ff4fa3;
      --violet: #9d7bff;
      --amber: #ffb020;
      --shadow: 0 1px 0 rgba(255,255,255,0.03), 0 18px 40px -24px rgba(0,0,0,0.9);
      --r: 14px;
    }

    [data-theme="light"] {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #f0f2f6;
      --line: #dfe3ea;
      --line-soft: #e9ecf2;
      --text: #12161d;
      --muted: #66717f;
      --acc: #6fd400;
      --acc-ink: #ffffff;
      --cyan: #0093c4;
      --magenta: #e0006b;
      --violet: #6b47e0;
      --amber: #c47800;
      --shadow: 0 1px 0 rgba(255,255,255,0.6), 0 18px 40px -30px rgba(20,30,50,0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root { color-scheme: dark; }
    [data-theme="light"] { color-scheme: light; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(900px 500px at 12% -10%, rgba(200,255,61,0.07), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(53,224,255,0.06), transparent 55%);
      background-attachment: fixed;
    }

    ::selection { background: var(--acc); color: var(--acc-ink); }

    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

    /* ---------- layout ---------- */
    .app {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: 100vh;
      max-width: 1360px;
      margin: 0 auto;
    }

    .rail {
      border-right: 1px solid var(--line-soft);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .logo {
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 8px;
    }

    .logo .caret { color: var(--acc); }
    .logo .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--acc);
      box-shadow: 0 0 12px var(--acc);
    }

    .nav { display: flex; flex-direction: column; gap: 3px; }

    .nav-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      text-align: left;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 11px;
      position: relative;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }

    .nav-btn svg { width: 16px; height: 16px; flex: none; opacity: .8; }
    .nav-btn:hover { color: var(--text); background: var(--panel); }
    .nav-btn .kbd {
      margin-left: auto;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 5px;
      opacity: 0;
      transition: opacity .16s;
    }
    .nav-btn:hover .kbd { opacity: 1; }

    .nav-btn.active {
      background: var(--panel);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--line-soft);
    }
    .nav-btn.active::before {
      content: "";
      position: absolute;
      left: -16px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 18px;
      border-radius: 0 3px 3px 0;
      background: var(--acc);
      box-shadow: 0 0 10px var(--acc);
    }
    .nav-btn.active svg { opacity: 1; color: var(--acc); }

    .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

    .rail-stat {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px dashed var(--line);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .rail-stat b { color: var(--text); font-weight: 500; }
    .rail-stat .ok { color: var(--acc); }

    .ghost {
      appearance: none;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      padding: 7px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: .16s;
    }
    .ghost:hover { color: var(--text); border-color: var(--muted); }

    /* ---------- main ---------- */
    main { min-width: 0; display: flex; flex-direction: column; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 28px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line-soft);
    }

    .crumb {
      font-family: "JetBrains Mono", monospace;
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
    }
    .crumb b { color: var(--text); font-weight: 500; }
    .crumb .prompt { color: var(--acc); }

    .topbar .spacer { flex: 1; }

    .clock {
      font-family: "JetBrains Mono", monospace;
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: .04em;
    }
    .clock b { color: var(--text); font-weight: 500; }

    .icon-btn {
      appearance: none;
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      transition: .16s;
    }
    .icon-btn:hover { color: var(--acc); border-color: var(--acc); }
    .icon-btn svg { width: 16px; height: 16px; }

    .view { padding: 28px; flex: 1; }

    /* ---------- generic ---------- */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .page-head h1 {
      font-size: clamp(1.6rem, 3.4vw, 2.2rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .page-head .sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      margin-top: 7px;
    }
    .page-head .sub .prompt { color: var(--acc); }

    .tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--r);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line-soft);
    }
    .panel-head h2 {
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-head h2::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--acc);
    }
    .panel-body { padding: 16px 18px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--r);
      padding: 16px 18px;
      position: relative;
      overflow: hidden;
    }
    .stat::after {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--c, var(--acc));
    }
    .stat .k {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat .v {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.04em;
      margin-top: 6px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat .v small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 3px; }
    .stat .h { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .cols {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .stack { display: flex; flex-direction: column; gap: 16px; }

    /* ---------- forms ---------- */
    .field {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      font-size: 14.5px;
      padding: 11px 13px;
      border-radius: 10px;
      outline: none;
      transition: border-color .16s, box-shadow .16s;
    }
    .field::placeholder { color: var(--muted); }
    .field:focus { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }

    select.field { cursor: pointer; appearance: none; padding-right: 30px; }

    .add-row { display: flex; gap: 9px; }
    .add-row .field { flex: 1; }

    .btn {
      appearance: none;
      border: 0;
      background: var(--acc);
      color: var(--acc-ink);
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 17px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .14s ease, filter .14s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.97); }
    .btn.alt { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-weight: 500; }

    .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
    .seg button {
      appearance: none; border: 0; background: transparent;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: .15s;
    }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }

    /* ---------- tasks ---------- */
    .list { display: flex; flex-direction: column; }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--line-soft);
      transition: background .15s;
    }
    .task:last-child { border-bottom: 0; }
    .task:hover { background: var(--panel-2); }

    .check {
      appearance: none;
      width: 18px; height: 18px;
      border: 1.5px solid var(--line);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      flex: none;
      display: grid;
      place-items: center;
      transition: .16s;
      position: relative;
    }
    .check:hover { border-color: var(--acc); }
    .check:checked { background: var(--acc); border-color: var(--acc); }
    .check:checked::after {
      content: "";
      width: 9px; height: 5px;
      border-left: 2px solid var(--acc-ink);
      border-bottom: 2px solid var(--acc-ink);
      transform: rotate(-45deg) translate(1px, -1px);
    }

    .task .txt { flex: 1; min-width: 0; font-size: 14.5px; }
    .task.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
    .task .txt .hastag { color: var(--cyan); font-family: "JetBrains Mono", monospace; font-size: 12.5px; }

    .prio {
      appearance: none; border: 0; background: transparent;
      width: 10px; height: 10px; border-radius: 50%;
      padding: 0; cursor: pointer; flex: none;
      background: var(--c);
      box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent);
      transition: transform .15s;
    }
    .prio:hover { transform: scale(1.35); }

    .del {
      appearance: none; border: 0; background: transparent;
      color: var(--muted); cursor: pointer;
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      opacity: 0;
      padding: 2px 6px;
      border-radius: 6px;
      transition: .15s;
    }
    .task:hover .del { opacity: 1; }
    .del:hover { color: var(--magenta); background: color-mix(in srgb, var(--magenta) 14%, transparent); }

    .empty {
      padding: 34px 18px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 12.5px;
      color: var(--muted);
    }
    .empty .prompt { color: var(--acc); }

    /* ---------- habits ---------- */
    .habit {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line-soft);
      flex-wrap: wrap;
    }
    .habit:last-child { border-bottom: 0; }

    .habit .name { width: 150px; flex: none; font-size: 14.5px; font-weight: 500; }
    .habit .name span {
      display: block;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .days { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }

    .day {
      appearance: none;
      width: 20px; height: 20px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      cursor: pointer;
      padding: 0;
      transition: .14s;
      position: relative;
    }
    .day:hover { border-color: var(--acc); transform: translateY(-2px); }
    .day.on {
      background: var(--c, var(--acc));
      border-color: var(--c, var(--acc));
      box-shadow: 0 0 10px color-mix(in srgb, var(--c, var(--acc)) 45%, transparent);
    }
    .day.today { outline: 1.5px dashed var(--muted); outline-offset: 2px; }

    .streak {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      flex: none;
      width: 74px;
      text-align: right;
    }
    .streak b { color: var(--amber); font-weight: 700; }

    /* ---------- goals ---------- */
    .goal { padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
    .goal:last-child { border-bottom: 0; }
    .goal .top { display: flex; align-items: center; gap: 12px; }
    .goal .top .t { flex: 1; font-size: 15px; font-weight: 500; }
    .goal .num {
      font-family: "JetBrains Mono", monospace;
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
    }
    .goal .num b { color: var(--text); font-size: 14px; }

    .bar { height: 7px; background: var(--panel-2); border-radius: 99px; margin-top: 12px; overflow: hidden; position: relative; }
    .bar i {
      position: absolute; inset: 0 auto 0 0;
      background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 55%, #fff));
      border-radius: 99px;
      transition: width .45s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 0 12px color-mix(in srgb, var(--c) 55%, transparent);
    }

    .stepper { display: flex; gap: 6px; align-items: center; }
    .stepper button {
      appearance: none;
      width: 26px; height: 26px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: .14s;
    }
    .stepper button:hover { border-color: var(--c, var(--acc)); color: var(--c, var(--acc)); }

    .goal .pct {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 7px;
      display: flex;
      justify-content: space-between;
    }
    .goal .pct .done { color: var(--c); }

    /* ---------- notes ---------- */
    .note { padding: 16px 18px; border-bottom: 1px solid var(--line-soft); position: relative; }
    .note:last-child { border-bottom: 0; }
    .note .meta {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 7px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .note .meta .dotc { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); }
    .note p { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
    .note .del { position: absolute; top: 12px; right: 14px; opacity: 0; }
    .note:hover .del { opacity: 1; }

    /* ---------- focus ---------- */
    .focus-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

    .timer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 20px 30px;
      gap: 22px;
    }

    .ring { position: relative; width: 232px; height: 232px; }
    .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring .track { stroke: var(--panel-2); }
    .ring .prog {
      stroke: var(--acc);
      stroke-linecap: round;
      transition: stroke-dashoffset .5s linear, stroke .3s;
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--acc) 60%, transparent));
    }
    .ring .inner {
      position: absolute; inset: 0;
      display: grid; place-content: center; text-align: center; gap: 4px;
    }
    .ring .time {
      font-family: "JetBrains Mono", monospace;
      font-size: 43px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .ring .mode {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .timer-ctrl { display: flex; gap: 10px; align-items: center; }

    .session-dots { display: flex; gap: 7px; justify-content: center; }
    .session-dots i {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--panel-2);
      border: 1px solid var(--line);
    }
    .session-dots i.on { background: var(--acc); border-color: var(--acc); box-shadow: 0 0 8px var(--acc); }

    /* ---------- statusline ---------- */
    .statusline {
      border-top: 1px solid var(--line-soft);
      padding: 11px 28px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      background: color-mix(in srgb, var(--bg) 70%, transparent);
    }
    .statusline .ok { color: var(--acc); }
    .statusline .sep { color: var(--line); }

    /* ---------- toast ---------- */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translate(-50%, 20px);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      font-size: 12.5px;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      z-index: 60;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast .prompt { color: var(--acc); }

    /* ---------- responsive ---------- */
    @media (max-width: 980px) {
      .cols, .focus-wrap { grid-template-columns: 1fr; }
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .rail {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        top: auto;
        height: auto;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(14px);
        border-right: 0;
        border-top: 1px solid var(--line);
        z-index: 40;
        overflow-x: auto;
      }
      .logo, .rail-foot { display: none; }
      .nav { flex-direction: row; gap: 4px; width: 100%; justify-content: space-between; }
      .nav-btn { flex-direction: column; gap: 4px; font-size: 10px; padding: 7px 9px; flex: 1; }
      .nav-btn .kbd { display: none; }
      .nav-btn.active::before { display: none; }
      .view { padding: 20px 16px 92px; }
      .topbar { padding: 13px 16px; }
      .statusline { display: none; }
      .habit .name { width: 100%; }
      .del { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="logo"><span class="dot"></span><span class="caret">▸</span>lifectl</div>

      <nav class="nav" id="nav">
        <button class="nav-btn active" data-view="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Overview <span class="kbd">1</span>
        </button>
        <button class="nav-btn" data-view="tasks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7l2.5 2.5L10 5.5"/><path d="M4 17l2.5 2.5L10 15.5"/><path d="M13 8h7M13 18h7"/></svg>
          Tasks <span class="kbd">2</span>
        </button>
        <button class="nav-btn" data-view="habits">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13h4l2.5 6L14 5l2.5 8H21"/></svg>
          Habits <span class="kbd">3</span>
        </button>
        <button class="nav-btn" data-view="goals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
          Goals <span class="kbd">4</span>
        </button>
        <button class="nav-btn" data-view="notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8.5 13h7M8.5 17h5"/></svg>
          Notes <span class="kbd">5</span>
        </button>
        <button class="nav-btn" data-view="focus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
          Focus <span class="kbd">6</span>
        </button>
      </nav>

      <div class="rail-foot">
        <div class="rail-stat">
          <span><span class="ok">●</span> local-first · no account</span>
          <span>store: <b>localStorage</b></span>
          <span>schema <b>lifectl.v1</b></span>
        </div>
        <button class="ghost" id="exportBtn">↓ export .json</button>
        <button class="ghost" id="resetBtn">↺ reset all data</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="crumb"><span class="prompt">~/life</span> <span style="opacity:.5">›</span> <b id="crumbView">overview</b></div>
        <div class="spacer"></div>
        <div class="clock" id="clock">--:--:--</div>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
      </header>

      <div class="view" id="view"></div>

      <footer class="statusline">
        <span class="ok">lifectl 0.9.0</span>
        <span class="sep">│</span>
        <span id="stTasks">0 open tasks</span>
        <span class="sep">│</span>
        <span id="stHabits">0 habits today</span>
        <span class="sep">│</span>
        <span id="stFocus">0m focus today</span>
        <span class="sep">│</span>
        <span>press <b style="color:var(--text)">/</b> to add · <b style="color:var(--text)">1–6</b> to navigate</span>
      </footer>
    </main>
  </div>

  <div id="toast"></div>

  <script>
  (function () {
    "use strict";

    /* ============ utils ============ */
    var KEY = "lifectl.v1";
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

    function iso(d) {
      d = d || new Date();
      var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return z.toISOString().slice(0, 10);
    }
    function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function fmtTag(s) {
      return esc(s).replace(/(^|\s)(#[\w-]+)/g, '$1<span class="hastag">$2</span>');
    }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    var PRIO = {
      1: { name: "high", c: "var(--magenta)" },
      2: { name: "med",  c: "var(--amber)" },
      3: { name: "low",  c: "var(--cyan)" }
    };
    var HABIT_COLORS = ["var(--magenta)", "var(--cyan)", "var(--violet)", "var(--amber)", "#4ade80", "#ff7b54"];
    var GOAL_COLORS = ["var(--cyan)", "var(--violet)", "var(--magenta)", "var(--amber)", "#4ade80"];

    /* ============ state ============ */
    function seed() {
      var today = new Date();
      var d = {};
      for (var i = 1; i <= 13; i++) d[iso(addDays(today, -i))] = true;
      var d2 = {};
      for (var j = 1; j <= 6; j++) if (j % 2 === 0) d2[iso(addDays(today, -j))] = true;

      return {
        theme: "dark",
        tasks: [
          { id: uid(), text: "Ship the portfolio landing page", prio: 1, done: false, ts: Date.now() - 9e5 },
          { id: uid(), text: "30 min walk #health", prio: 2, done: false, ts: Date.now() - 8e5 },
          { id: uid(), text: "Reply to Mira about the lease", prio: 2, done: true, ts: Date.now() - 7e5 },
          { id: uid(), text: "Review monthly budget #money", prio: 3, done: false, ts: Date.now() - 6e5 }
        ],
        habits: [
          { id: uid(), name: "Read 20 pages", days: d, color: HABIT_COLORS[1] },
          { id: uid(), name: "Move / workout", days: d2, color: HABIT_COLORS[0] },
          { id: uid(), name: "No screens after 23:00", days: {}, color: HABIT_COLORS[2] }
        ],
        goals: [
          { id: uid(), title: "Emergency fund", current: 2400, target: 6000, unit: "€" },
          { id: uid(), title: "Run 100 km this month", current: 42, target: 100, unit: "km" }
        ],
        notes: [
          { id: uid(), text: "Idea: weekly review every Sunday, 20 min. Clear inbox, plan top 3, reset habits.", ts: Date.now() - 864e5 }
        ],
        focus: { date: iso(), sessions: 2, minutes: 50 }
      };
    }

    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return seed();
        var s = JSON.parse(raw);
        if (!s || typeof s !== "object" || !s.tasks) return seed();
        s.goals = s.goals || []; s.notes = s.notes || []; s.habits = s.habits || [];
        s.focus = s.focus || { date: iso(), sessions: 0, minutes: 0 };
        return s;
      } catch (e) { return seed(); }
    }

    var S = load();
    var view = "overview";
    var taskFilter = "all";

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      statusline();
    }

    function rollFocus() {
      if (S.focus.date !== iso()) { S.focus = { date: iso(), sessions: 0, minutes: 0 }; save(); }
    }
    rollFocus();

    /* ============ theme ============ */
    function applyTheme() {
      document.documentElement.setAttribute("data-theme", S.theme || "dark");
      $("#themeIcon").innerHTML = S.theme === "light"
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
        : '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>';
    }
    $("#themeBtn").addEventListener("click", function () {
      S.theme = (S.theme === "light") ? "dark" : "light";
      applyTheme(); save();
      toast("theme → " + S.theme);
    });
    applyTheme();

    /* ============ toast / clock / status ============ */
    var toastT;
    function toast(msg) {
      var el = $("#toast");
      el.innerHTML = '<span class="prompt">$</span> ' + esc(msg);
      el.classList.add("show");
      clearTimeout(toastT);
      toastT = setTimeout(function () { el.classList.remove("show"); }, 1900);
    }

    function tickClock() {
      var d = new Date();
      var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      var mon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      var p = function (n) { return String(n).padStart(2, "0"); };
      $("#clock").innerHTML = days[d.getDay()] + " " + p(d.getDate()) + " " + mon[d.getMonth()] +
        " <b>" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "</b>";
    }
    tickClock(); setInterval(tickClock, 1000);

    function statusline() {
      var open = S.tasks.filter(function (t) { return !t.done; }).length;
      var hit = S.habits.filter(function (h) { return h.days[iso()]; }).length;
      $("#stTasks").textContent = open + " open task" + (open === 1 ? "" : "s");
      $("#stHabits").textContent = hit + "/" + S.habits.length + " habits today";
      $("#stFocus").textContent = S.focus.minutes + "m focus today";
    }

    /* ============ derived ============ */
    function streak(days) {
      var n = 0, d = new Date();
      if (!days[iso(d)]) d = addDays(d, -1);
      while (days[iso(d)]) { n++; d = addDays(d, -1); }
      return n;
    }
    function lastDays(n) {
      var out = [], t = new Date();
      for (var i = n - 1; i >= 0; i--) out.push(addDays(t, -i));
      return out;
    }

    /* ============ views ============ */
    var views = {};

    views.overview = function () {
      var open = S.tasks.filter(function (t) { return !t.done; }).length;
      var done = S.tasks.length - open;
      var hit = S.habits.filter(function (h) { return h.days[iso()]; }).length;
      var best = S.habits.reduce(function (m, h) { return Math.max(m, streak(h.days)); }, 0);
      var goalPct = S.goals.length
        ? Math.round(S.goals.reduce(function (a, g) { return a + clamp(g.current / g.target, 0, 1); }, 0) / S.goals.length * 100)
        : 0;
      var h = new Date().getHours();
      var greet = h < 5 ? "Still up" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      var top = S.tasks.filter(function (t) { return !t.done; }).sort(function (a, b) { return a.prio - b.prio; }).slice(0, 5);
      var today = lastDays(7);

      return '' +
        '<div class="page-head">' +
          '<div><h1>' + greet + '.</h1>' +
          '<div class="sub"><span class="prompt">›</span> everything is stored on this device only</div></div>' +
          '<span class="tag">' + iso() + '</span>' +
        '</div>' +

        '<div class="stats">' +
          stat("Open tasks", open, "", "var(--magenta)", done + " done all-time") +
          stat("Habits today", hit + "<small>/" + S.habits.length + "</small>", "", "var(--cyan)", "best streak " + best + "d") +
          stat("Focus today", S.focus.minutes, "m", "var(--acc)", S.focus.sessions + " session(s) logged") +
          stat("Goals", goalPct, "%", "var(--violet)", S.goals.length + " active track(s)") +
        '</div>' +

        '<div class="cols">' +
          '<div class="stack">' +
            panel("Next up", '<div class="list">' + (top.length ? top.map(taskRow).join("") :
              '<div class="empty"><span class="prompt">›</span> inbox zero. add something with /</div>') + '</div>') +
            panel("Last 7 days", habitStrip(today)) +
          '</div>' +
          '<div class="stack">' +
            panel("Habits", habitList(S.habits.slice(0, 3), false)) +
            panel("Active goals", goalList(S.goals.slice(0, 3))) +
          '</div>' +
        '</div>';
    };

    views.tasks = function () {
      var list = S.tasks.slice().sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (a.prio !== b.prio) return a.prio - b.prio;
        return b.ts - a.ts;
      });
      if (taskFilter === "open") list = list.filter(function (t) { return !t.done; });
      if (taskFilter === "done") list = list.filter(function (t) { return t.done; });

      return '' +
        '<div class="page-head">' +
          '<div><h1>Tasks</h1><div class="sub"><span class="prompt">›</span> #tag marks · cycle the dot for priority</div></div>' +
          '<div class="seg" id="taskSeg">' +
            seg("all", taskFilter) + seg("open", taskFilter) + seg("done", taskFilter) +
          '</div>' +
        '</div>' +

        '<div class="stack">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>New task</h2></div>' +
            '<div class="panel-body">' +
              '<form class="add-row" id="taskForm">' +
                '<input class="field" id="taskInput" placeholder="› what needs doing? use #tags" autocomplete="off" maxlength="140" />' +
                '<select class="field" id="taskPrio" style="width:110px;flex:none">' +
                  '<option value="1">high</option><option value="2" selected>med</option><option value="3">low</option>' +
                '</select>' +
                '<button class="btn" type="submit">add</button>' +
              '</form>' +
            '</div>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>' + taskFilter + ' · ' + list.length + '</h2></div>' +
            '<div class="list">' + (list.length ? list.map(taskRow).join("") :
              '<div class="empty"><span class="prompt">›</span> nothing here</div>') + '</div>' +
          '</div>' +
        '</div>';
    };

    views.habits = function () {
      return '' +
        '<div class="page-head">' +
          '<div><h1>Habits</h1><div class="sub"><span class="prompt">›</span> click a square to log a day</div></div>' +
          '<span class="tag">last 14 days</span>' +
        '</div>' +

        '<div class="stack">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>New habit</h2></div>' +
            '<div class="panel-body">' +
              '<form class="add-row" id="habitForm">' +
                '<input class="field" id="habitInput" placeholder="› e.g. stretch for 10 minutes" autocomplete="off" maxlength="70" />' +
                '<button class="btn" type="submit">track</button>' +
              '</form>' +
            '</div>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>Consistency</h2></div>' +
            habitList(S.habits, true) +
          '</div>' +
        '</div>';
    };

    views.goals = function () {
      return '' +
        '<div class="page-head">' +
          '<div><h1>Goals</h1><div class="sub"><span class="prompt">›</span> slow compound progress, one step at a time</div></div>' +
          '<span class="tag">' + S.goals.length + ' active</span>' +
        '</div>' +

        '<div class="stack">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>New goal</h2></div>' +
            '<div class="panel-body">' +
              '<form class="add-row" id="goalForm">' +
                '<input class="field" id="goalTitle" placeholder="› goal title" autocomplete="off" maxlength="60" />' +
                '<input class="field" id="goalTarget" type="number" min="1" step="1" placeholder="target" style="width:120px;flex:none" />' +
                '<input class="field" id="goalUnit" placeholder="unit" style="width:100px;flex:none" maxlength="8" />' +
                '<button class="btn" type="submit">create</button>' +
              '</form>' +
            '</div>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>Trackers</h2></div>' +
            goalList(S.goals) +
          '</div>' +
        '</div>';
    };

    views.notes = function () {
      var notes = S.notes.slice().sort(function (a, b) { return b.ts - a.ts; });
      return '' +
        '<div class="page-head">' +
          '<div><h1>Notes</h1><div class="sub"><span class="prompt">›</span> quick capture, plain text, no folders</div></div>' +
          '<span class="tag">' + notes.length + ' note(s)</span>' +
        '</div>' +

        '<div class="stack">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>Capture</h2></div>' +
            '<div class="panel-body">' +
              '<form id="noteForm" class="stack" style="gap:10px">' +
                '<textarea class="field" id="noteInput" rows="3" placeholder="› jot it down before it evaporates" maxlength="600"></textarea>' +
                '<div style="display:flex;justify-content:flex-end"><button class="btn" type="submit">save note</button></div>' +
              '</form>' +
            '</div>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>All notes</h2></div>' +
            (notes.length ? notes.map(noteRow).join("") :
              '<div class="empty"><span class="prompt">›</span> no notes yet</div>') +
          '</div>' +
        '</div>';
    };

    views.focus = function () {
      var total = T.mode === "work" ? T.len : T.breakLen;
      return '' +
        '<div class="page-head">' +
          '<div><h1>Focus</h1><div class="sub"><span class="prompt">›</span> deep work, in bounded slices</div></div>' +
          '<div class="seg" id="presetSeg">' +
            '<button data-min="25" data-brk="5" class="' + (T.len === 1500 ? "on" : "") + '">25/5</button>' +
            '<button data-min="50" data-brk="10" class="' + (T.len === 3000 ? "on" : "") + '">50/10</button>' +
            '<button data-min="15" data-brk="3" class="' + (T.len === 900 ? "on" : "") + '">15/3</button>' +
          '</div>' +
        '</div>' +

        '<div class="focus-wrap">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>Timer</h2></div>' +
            '<div class="timer">' +
              '<div class="ring">' +
                '<svg viewBox="0 0 120 120">' +
                  '<circle class="track" cx="60" cy="60" r="54" fill="none" stroke-width="7"/>' +
                  '<circle class="prog" id="ringProg" cx="60" cy="60" r="54" fill="none" stroke-width="7" ' +
                    'stroke-dasharray="339.29" stroke-dashoffset="0"/>' +
                '</svg>' +
                '<div class="inner">' +
                  '<div class="time" id="timeText">' + fmtTime(T.left) + '</div>' +
                  '<div class="mode" id="modeText">' + (T.mode === "work" ? "deep work" : "break") + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="session-dots" id="dots">' + dots() + '</div>' +
              '<div class="timer-ctrl">' +
                '<button class="btn" id="startBtn">' + (T.running ? "pause" : "start") + '</button>' +
                '<button class="btn alt" id="resetTimer">reset</button>' +
                '<button class="btn alt" id="skipTimer">skip</button>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="stack">' +
            panel("Today", '<div class="stats" style="grid-template-columns:1fr 1fr;margin:0">' +
              stat("Sessions", S.focus.sessions, "", "var(--acc)", "target 4") +
              stat("Minutes", S.focus.minutes, "m", "var(--cyan)", "on-device log") +
            '</div>') +
            panel("Protocol", '<div class="stack" style="gap:10px;font-size:14px;color:var(--muted)">' +
              proto("01", "Pick one task. Close everything else.") +
              proto("02", "Start the timer. Work until it rings.") +
              proto("03", "Take the break. No exceptions.") +
              proto("04", "After 4 sessions, take a longer walk.") +
            '</div>') +
          '</div>' +
        '</div>';
    };

    /* ---------- view fragments ---------- */
    function stat(k, v, unit, c, h) {
      return '<div class="stat" style="--c:' + c + '"><div class="k">' + k + '</div>' +
        '<div class="v">' + v + (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
        '<div class="h">' + h + '</div></div>';
    }
    function panel(title, body) {
      return '<div class="panel"><div class="panel-head"><h2>' + title + '</h2></div>' + body + '</div>';
    }
    function seg(id, cur) {
      var label = id === "all" ? "all" : id;
      return '<button data-filter="' + id + '" class="' + (cur === id ? "on" : "") + '">' + label + '</button>';
    }
    function proto(n, t) {
      return '<div style="display:flex;gap:12px"><span class="mono" style="color:var(--acc);font-size:12px">' + n + '</span><span>' + t + '</span></div>';
    }

    function taskRow(t) {
      return '<div class="task' + (t.done ? " done" : "") + '" data-id="' + t.id + '">' +
        '<input class="check" type="checkbox" data-act="toggle-task" ' + (t.done ? "checked" : "") + ' aria-label="toggle" />' +
        '<button class="prio" data-act="cycle-prio" style="--c:' + PRIO[t.prio].c + '" title="priority: ' + PRIO[t.prio].name + '"></button>' +
        '<div class="txt">' + fmtTag(t.text) + '</div>' +
        '<button class="del" data-act="del-task" title="delete">×</button>' +
      '</div>';
    }

    function habitStrip(days) {
      var body = '<div class="panel-body" style="display:flex;gap:8px;flex-wrap:wrap">';
      days.forEach(function (d, i) {
        var hit = S.habits.filter(function (h) { return h.days[iso(d)]; }).length;
        var pct = S.habits.length ? hit / S.habits.length : 0;
        body += '<div style="flex:1;min-width:64px;text-align:center">' +
          '<div style="height:56px;border-radius:9px;border:1px solid var(--line-soft);background:' +
            'color-mix(in srgb, var(--acc) ' + Math.round(pct * 75) + '%, var(--panel-2))' +
            ';display:grid;place-items:center;font-family:JetBrains Mono,monospace;font-size:13px;color:' +
            (pct > 0.3 ? "var(--acc-ink)" : "var(--muted)") + '">' + hit + '/' + S.habits.length + '</div>' +
          '<div class="mono" style="font-size:10px;color:var(--muted);margin-top:6px">' +
            (i === days.length - 1 ? "today" : ["Su","Mo","Tu","We","Th","Fr","Sa"][d.getDay()]) + '</div>' +
        '</div>';
      });
      return body + '</div>';
    }

    function habitList(habits, full) {
      if (!habits.length) return '<div class="empty"><span class="prompt">›</span> no habits yet</div>';
      var days = full ? lastDays(14) : lastDays(7);
      return habits.map(function (h) {
        var s = streak(h.days);
        var cells = days.map(function (d) {
          var on = !!h.days[iso(d)];
          var isToday = iso(d) === iso();
          return '<button class="day' + (on ? " on" : "") + (isToday ? " today" : "") + '" ' +
            'data-act="toggle-habit" data-id="' + h.id + '" data-day="' + iso(d) + '" ' +
            'style="--c:' + h.color + '" title="' + iso(d) + (on ? " · done" : " · miss") + '"></button>';
        }).join("");
        return '<div class="habit">' +
          '<div class="name">' + esc(h.name) + '<span>' + (h.days[iso()] ? "done today" : "not yet today") + '</span></div>' +
          '<div class="days">' + cells + '</div>' +
          '<div class="streak">' + (s > 0 ? '<b>◆ ' + s + '</b> day' + (s === 1 ? "" : "s") : "—") + '</div>' +
          '<button class="del" data-act="del-habit" data-id="' + h.id + '" style="opacity:1">×</button>' +
        '</div>';
      }).join("");
    }

    function goalList(goals) {
      if (!goals.length) return '<div class="empty"><span class="prompt">›</span> no goals yet — define one above</div>';
      return goals.map(function (g, i) {
        var pct = clamp(Math.round(g.current / g.target * 100), 0, 100);
        var c = GOAL_COLORS[i % GOAL_COLORS.length];
        var unit = g.unit === "€" ? "€" : (g.unit ? " " + g.unit : "");
        var cur = g.unit === "€" ? "€" + g.current : g.current + unit;
        var tgt = g.unit === "€" ? "€" + g.target : g.target + unit;
        return '<div class="goal" style="--c:' + c + '">' +
          '<div class="top">' +
            '<div class="t">' + esc(g.title) + '</div>' +
            '<div class="stepper">' +
              '<button data-act="goal-dec" data-id="' + g.id + '">−</button>' +
              '<button data-act="goal-inc" data-id="' + g.id + '">+</button>' +
              '<button class="del" data-act="del-goal" data-id="' + g.id + '" style="opacity:1">×</button>' +
            '</div>' +
          '</div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="pct"><span><b>' + cur + '</b> / ' + tgt + '</span><span class="' + (pct >= 100 ? "done" : "") + '">' + pct + '%</span></div>' +
        '</div>';
      }).join("");
    }

    function noteRow(n) {
      var d = new Date(n.ts);
      var p = function (x) { return String(x).padStart(2, "0"); };
      return '<div class="note">' +
        '<div class="meta"><span class="dotc"></span>' + iso(d) + ' · ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '</div>' +
        '<p>' + esc(n.text) + '</p>' +
        '<button class="del" data-act="del-note" data-id="' + n.id + '">×</button>' +
      '</div>';
    }

    function dots() {
      var lit = S.focus.sessions > 0 && S.focus.sessions % 4 === 0 ? 4 : S.focus.sessions % 4;
      var out = "";
      for (var i = 0; i < 4; i++) out += '<i class="' + (i < lit ? "on" : "") + '"></i>';
      return out;
    }

    /* ============ timer ============ */
    var T = { mode: "work", len: 25 * 60, breakLen: 5 * 60, left: 25 * 60, running: false, iv: null };

    function fmtTime(s) {
      var m = Math.floor(s / 60), r = s % 60;
      return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
    }

    function paintTimer() {
      var el = $("#timeText");
      if (!el) return;
      var total = T.mode === "work" ? T.len : T.breakLen;
      el.textContent = fmtTime(T.left);
      $("#modeText").textContent = T.mode === "work" ? "deep work" : "break";
      var C = 2 * Math.PI * 54;
      var ring = $("#ringProg");
      if (ring) {
        ring.style.strokeDasharray = C;
        ring.style.strokeDashoffset = C * (1 - T.left / total);
        ring.style.stroke = T.mode === "work" ? "var(--acc)" : "var(--cyan)";
      }
      var sb = $("#startBtn");
      if (sb) sb.textContent = T.running ? "pause" : "start";
      document.title = (T.running ? fmtTime(T.left) + " · " : "") + "lifectl";
    }

    function beep() {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var ac = new Ctx();
        [0, 0.18, 0.36].forEach(function (t, i) {
          var o = ac.createOscillator(), g = ac.createGain();
          o.type = "sine"; o.frequency.value = 660 + i * 220;
          g.gain.setValueAtTime(0.0001, ac.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.14, ac.currentTime + t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.22);
          o.connect(g); g.connect(ac.destination);
          o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.24);
        });
        setTimeout(function () { ac.close(); }, 1200);
      } catch (e) {}
    }

    function timerEnd() {
      clearInterval(T.iv); T.iv = null; T.running = false;
      beep();
      if (T.mode === "work") {
        S.focus.sessions += 1;
        S.focus.minutes += Math.round(T.len / 60);
        rollFocus(); save();
        toast("session complete · + " + Math.round(T.len / 60) + "m logged");
        T.mode = "break"; T.left = T.breakLen;
      } else {
        toast("break over · back to it");
        T.mode = "work"; T.left = T.len;
      }
      render();
    }

    function timerTick() {
      T.left--;
      if (T.left <= 0) { timerEnd(); return; }
      paintTimer();
    }

    function timerToggle() {
      if (T.running) {
        clearInterval(T.iv); T.iv = null; T.running = false;
      } else {
        T.running = true;
        T.iv = setInterval(timerTick, 1000);
      }
      paintTimer();
    }

    /* ============ render ============ */
    function render() {
      $("#view").innerHTML = views[view]();
      $("#crumbView").textContent = view;
      paintTimer();
      statusline();
    }

    function go(v) {
      if (!views[v]) return;
      view = v;
      $$("#nav .nav-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.view === v);
      });
      render();
    }

    $("#nav").addEventListener("click", function (e) {
      var b = e.target.closest("[data-view]");
      if (b) go(b.dataset.view);
    });

    /* ============ actions ============ */
    document.addEventListener("submit", function (e) {
      var f = e.target;
      if (f.id === "taskForm") {
        e.preventDefault();
        var v = $("#taskInput").value.trim();
        if (!v) return;
        S.tasks.unshift({ id: uid(), text: v, prio: +$("#taskPrio").value, done: false, ts: Date.now() });
        save(); render(); toast("task added");
        $("#taskInput").focus();
      }
      if (f.id === "habitForm") {
        e.preventDefault();
        var hn = $("#habitInput").value.trim();
        if (!hn) return;
        S.habits.push({ id: uid(), name: hn, days: {}, color: HABIT_COLORS[S.habits.length % HABIT_COLORS.length] });
        save(); render(); toast("habit tracked");
        $("#habitInput").focus();
      }
      if (f.id === "goalForm") {
        e.preventDefault();
        var t = $("#goalTitle").value.trim();
        var n = parseInt($("#goalTarget").value, 10);
        if (!t || !n || n < 1) { toast("need a title and a target > 0"); return; }
        S.goals.push({ id: uid(), title: t, current: 0, target: n, unit: $("#goalUnit").value.trim() || "units" });
        save(); render(); toast("goal created");
      }
      if (f.id === "noteForm") {
        e.preventDefault();
        var txt = $("#noteInput").value.trim();
        if (!txt) return;
        S.notes.unshift({ id: uid(), text: txt, ts: Date.now() });
        save(); render(); toast("note saved");
      }
    });

    document.addEventListener("click", function (e) {
      var el = e.target.closest("[data-act], [data-filter], [data-min]");
      if (!el) return;

      if (el.dataset.filter) {
        taskFilter = el.dataset.filter;
        render();
        return;
      }

      if (el.dataset.min) {
        clearInterval(T.iv); T.iv = null; T.running = false;
        T.len = +el.dataset.min * 60;
        T.breakLen = +el.dataset.brk * 60;
        T.mode = "work"; T.left = T.len;
        render();
        return;
      }

      var id = el.dataset.id;
      var act = el.dataset.act;

      if (act === "toggle-task" || act === "cycle-prio" || act === "del-task") {
        var row = el.closest(".task");
        id = row.dataset.id;
        var i = S.tasks.findIndex(function (t) { return t.id === id; });
        if (i < 0) return;
        if (act === "toggle-task") {
          S.tasks[i].done = !S.tasks[i].done;
          if (S.tasks[i].done) toast("done · nice");
        } else if (act === "cycle-prio") {
          S.tasks[i].prio = S.tasks[i].prio >= 3 ? 1 : S.tasks[i].prio + 1;
        } else {
          S.tasks.splice(i, 1);
          toast("task removed");
        }
        save(); render(); return;
      }

      if (act === "toggle-habit") {
        var hs = S.habits.findIndex(function (h) { return h.id === id; });
        if (hs < 0) return;
        var day = el.dataset.day;
        if (S.habits[hs].days[day]) delete S.habits[hs].days[day];
        else S.habits[hs].days[day] = true;
        save(); render(); return;
      }
      if (act === "del-habit") {
        S.habits = S.habits.filter(function (h) { return h.id !== id; });
        save(); render(); toast("habit removed"); return;
      }

      if (act === "goal-inc" || act === "goal-dec") {
        var gi = S.goals.findIndex(function (g) { return g.id === id; });
        if (gi < 0) return;
        var step = Math.max(1, Math.round(S.goals[gi].target / 25));
        S.goals[gi].current = clamp(S.goals[gi].current + (act === "goal-inc" ? step : -step), 0, S.goals[gi].target);
        if (S.goals[gi].current === S.goals[gi].target) toast("goal reached · " + S.goals[gi].title);
        save(); render(); return;
      }
      if (act === "del-goal") {
        S.goals = S.goals.filter(function (g) { return g.id !== id; });
        save(); render(); toast("goal removed"); return;
      }

      if (act === "del-note") {
        S.notes = S.notes.filter(function (n) { return n.id !== id; });
        save(); render(); toast("note deleted"); return;
      }
    });

    /* timer buttons (rendered dynamically) */
    document.addEventListener("click", function (e) {
      if (e.target.id === "startBtn") timerToggle();
      if (e.target.id === "resetTimer") {
        clearInterval(T.iv); T.iv = null; T.running = false;
        T.mode = "work"; T.left = T.len;
        paintTimer();
      }
      if (e.target.id === "skipTimer") timerEnd();
    });

    /* ============ rail utilities ============ */
    $("#exportBtn").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "lifectl-" + iso() + ".json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast("exported");
    });

    $("#resetBtn").addEventListener("click", function () {
      if (!confirm("Wipe all local data and reload the sample set?")) return;
      S = seed(); save(); applyTheme(); go("overview"); toast("data reset");
    });

    /* ============ keyboard ============ */
    document.addEventListener("keydown", function (e) {
      var inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === "/" && !inField) {
        e.preventDefault();
        var f = $("#taskInput") || $("#habitInput") || $("#goalTitle") || $("#noteInput");
        if (f) f.focus();
        else go("tasks");
        return;
      }
      if (inField) return;
      if (e.key >= "1" && e.key <= "6") {
        go(["overview", "tasks", "habits", "goals", "notes", "focus"][+e.key - 1]);
      }
      if (e.key === " " && view === "focus") { e.preventDefault(); timerToggle(); }
    });

    /* ============ boot ============ */
    statusline();
    render();
  })();
  </script>
</body>
</html>
